
name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    # O runner próprio precisa estar instalado no Windows 11 IoT Enterprise 26H2.
    runs-on: [self-hosted, Windows, X64, iot-enterprise-26h2]
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Windows 11 IoT Enterprise 26H2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $os = Get-CimInstance Win32_OperatingSystem
          $cv = Get-ItemProperty `
            "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"

          Write-Host "=== WINDOWS SYSTEM ===" -ForegroundColor Cyan
          Write-Host "Product: $($os.Caption)"
          Write-Host "Version: $($os.Version)"
          Write-Host "Build: $($os.BuildNumber)"
          Write-Host "Display version: $($cv.DisplayVersion)"

          if ($os.Caption -notmatch "IoT Enterprise" -or
              $cv.DisplayVersion -ne "26H2") {
            throw "Este runner não está identificado como Windows 11 IoT Enterprise 26H2. Execução interrompida."
          }

          Write-Host "Windows 11 IoT Enterprise 26H2 confirmado." `
            -ForegroundColor Green

      - name: System Information
        shell: pwsh
        env:
          INSTANCE_NUMBER: ${{ inputs.instance_number }}
        run: |
          Write-Host "=== ENIGMANO RDP DEPLOYMENT ===" `
            -ForegroundColor Green

          Write-Host "Instance: $env:INSTANCE_NUMBER"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workflow: $env:GITHUB_WORKFLOW"

          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion,
              OsBuildNumber, CsTotalPhysicalMemory |
            Format-List

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores,
              NumberOfLogicalProcessors |
            Format-List

      - name: Enable RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling Remote Desktop..." `
            -ForegroundColor Green

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1

          $rules = Get-NetFirewallRule -ErrorAction SilentlyContinue |
            Where-Object {
              $_.DisplayGroup -match
                'Remote Desktop|Área de Trabalho Remota'
            }

          if (-not $rules) {
            throw "Regras de firewall do RDP não encontradas."
          }

          $rules | Enable-NetFirewallRule

          Write-Host "RDP configured." -ForegroundColor Green

      - name: Create User Account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Configure o segredo RDP_PASSWORD no GitHub."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "runneradmin" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name "runneradmin" `
              -Password $securePassword `
              -Description "Conta RDP administrada pelo workflow" |
              Out-Null
          } else {
            Set-LocalUser -Name "runneradmin" `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "runneradmin" `
            -ErrorAction SilentlyContinue

          Write-Host "Conta runneradmin configurada."
          Write-Host "A senha não será exibida nos logs."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installerPath = Join-Path $env:TEMP "tailscale.msi"
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest -Uri $tsUrl `
            -OutFile $installerPath

          $process = Start-Process msiexec.exe `
            -ArgumentList @(
              "/i", "`"$installerPath`"",
              "/quiet", "/norestart"
            ) -Wait -PassThru

          Remove-Item $installerPath -Force `
            -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Instalação do Tailscale falhou: $($process.ExitCode)"
          }

          Write-Host "Tailscale installation completed."

      - name: Start Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Configure o segredo TAILSCALE_AUTH_KEY no GitHub."
          }

          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            throw "Executável do Tailscale não encontrado."
          }

          $hostname = "enigmano-$env:GITHUB_RUN_ID"

          & $tsExe up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="$hostname"

          if ($LASTEXITCODE -ne 0) {
            throw "Não foi possível conectar ao Tailscale."
          }

          Start-Sleep -Seconds 10

          Write-Host "Tailscale startup completed."

      - name: Get Tailscale IP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          $tsIP = (& $tsExe ip -4 | Select-Object -First 1).Trim()

          if ($LASTEXITCODE -ne 0 -or
              [string]::IsNullOrWhiteSpace($tsIP)) {
            throw "Não foi possível obter o IP do Tailscale."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP" `
            -ForegroundColor Green

      - name: Install Google Chrome
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installerPath = Join-Path $env:TEMP "chrome_installer.exe"
          $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"

          Invoke-WebRequest -Uri $chromeUrl `
            -OutFile $installerPath

          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList "/silent /install" `
            -Wait -PassThru

          Remove-Item $installerPath -Force `
            -ErrorAction SilentlyContinue

          if ($process.ExitCode -ne 0) {
            throw "A instalação do Chrome retornou código $($process.ExitCode)."
          }

          Write-Host "Chrome installation completed."

      - name: Install 7-Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installerPath = Join-Path $env:TEMP "7zip-installer.exe"
          $zipUrl = "https://www.7-zip.org/a/7z2409-x64.exe"

          Invoke-WebRequest -Uri $zipUrl `
            -OutFile $installerPath

          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList "/S" `
            -Wait -PassThru

          Remove-Item $installerPath -Force `
            -ErrorAction SilentlyContinue

          if ($process.ExitCode -ne 0) {
            throw "A instalação do 7-Zip falhou."
          }

          Write-Host "7-Zip installation completed."

      - name: Connection Details
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=== ENIGMANO RDP ACCESS ===" `
            -ForegroundColor Green

          Write-Host "Host: $env:TAILSCALE_IP"
          Write-Host "Username: runneradmin"
          Write-Host "Password: definida no segredo RDP_PASSWORD"

          Write-Host ""
          Write-Host "1. Instale o Tailscale no dispositivo cliente."
          Write-Host "2. Entre na mesma rede Tailscale autorizada."
          Write-Host "3. Abra o aplicativo de Área de Trabalho Remota."
          Write-Host "4. Informe o IP exibido acima."
          Write-Host "5. Use runneradmin e a senha configurada."

      - name: Keep Session Alive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          $counter = 0

          Write-Host "=== SESSION ACTIVE ===" `
            -ForegroundColor Green

          Write-Host "O limite desta execução é de 6 horas."

          while ($true) {
            $counter++

            Write-Host "Heartbeat #$counter - $(Get-Date)"

            & $tsExe status *> $null

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Tailscale desconectado; tentando recuperar."

              & $tsExe up `
                --hostname="enigmano-$env:GITHUB_RUN_ID"

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "A reconexão automática falhou."
              }
            } else {
              Write-Host "Tailscale status: OK" `
                -ForegroundColor Green
            }

            Start-Sleep -Seconds 60
          }
          
